name: Synthetic receptionist tests
on:
  push:
    paths:
      - 'pilot-api/**'
      - '.github/workflows/receptionist-tests.yml'
  pull_request:
    paths:
      - 'pilot-api/**'
      - '.github/workflows/receptionist-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test API with fictional data
        run: node pilot-api/server.test.js
